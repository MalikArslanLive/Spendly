workflows:
  android-build:
    name: Spendly APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    scripts:
      - name: Check Signing SHA
        script: |
          chmod +x ./gradlew
          ./gradlew :app:signingReport

      - name: Build Android APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
